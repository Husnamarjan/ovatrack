name: pcod_predictor
description: A PCOD Predictor App for tracking health and predicting symptoms.

# The version of your app
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

# Dependencies for your Flutter app
dependencies:
  flutter:
    sdk: flutter

  shared_preferences: ^2.1.1
  cupertino_icons: ^1.0.5
  syncfusion_flutter_charts: ^31.1.20
  http: ^1.1.0
  table_calendar: ^3.0.9
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.0.15

  # TFLite (compatible stable version)
  tflite_flutter: ^0.11.0

  # Flutter local notifications (compatible stable version)
  flutter_local_notifications: ^19.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  hive_generator: ^2.0.0
  build_runner: ^2.4.6
  analyzer: 6.4.1

# Flutter-specific configuration
flutter:
  uses-material-design: true

  assets:
    - assets/images/woman_logo.png
    - assets/models/pcod_model.tflite
